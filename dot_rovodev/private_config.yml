version: 1

# Agent behavior and model settings
agent:
  # Additional system prompt to append to the agent's default system prompt
  additionalSystemPrompt: null
  # Enable streaming responses from the AI model
  streaming: true
  # Temperature setting for AI model responses (0.0-1.0)
  temperature: 0.3
  # Model ID to use for the agent. See /models command to list available models.
  modelId: openai-responses-api:gpt-6.1-sol
  # Maximum model requests in one agent run (one prompt). Guards against runaway
  # loops. The ROVODEV_MAX_REQUESTS_PER_RUN environment variable overrides it.
  maxRequestsPerRun: 5000
  # Optional model variant key selected from dynamic configuration.
  modelVariant: null
  # Per-model inference parameter overrides keyed by model ID.
  inferenceConfig: null
  # Enable the deep planning tool for complex task planning
  enableDeepPlanTool: false
  # Efficiency level controlling iteration limits. Options: low, medium
  # (default), high, max.
  efficiencyLevel: medium
  # Enable/disable subagents for task delegation
  enableSubagents: true
  # Additional directories to search for skills, beyond the RovoDev-native paths
  # (~/.rovodev/skills/, ~/.agents/skills/, project paths). The Agent Skills
  # SKILL.md format is an open standard shared with Claude Code, OpenAI Codex
  # CLI, and others; this lets users install a skill once and have it picked up
  # across tools.   null  -> use defaults (~/.claude/skills, ~/.codex/skills).
  # []    -> disable external skill discovery entirely.   list  -> replaces the
  # defaults; supports ~ expansion.
  externalSkillDirs: null
  # Enable/disable experimental features
  experimental: {}

# Session management settings
sessions:
  # Directory where session data is stored
  persistenceDir: /home/emile/.rovodev/sessions
  # Largest session file, in MB, that can be restored. Larger sessions are
  # skipped with a message. The ROVODEV_MAX_RESTORE_SIZE_MB environment variable
  # overrides it.
  maxRestoreSizeMb: 50
  # Enable session memory over prior sessions when enabled by dynamic
  # configuration
  enableSessionMemory: true
  # Allow session memory to reference sessions from other workspace locations
  enableCrossWorkspaceSessionMemory: false
  # (Experimental) When enabled, Rovo Dev may warn and offer to switch your
  # workspace git state (branch/commit) to match the session checkpoint when
  # restoring or switching sessions.
  enableWorkspaceStateSync: false

# Atlassian product integration settings
atlassianConnections:
  # Global jira projects user is part of
  jiraProjects:
  - url: https://auro-3d.atlassian.net/browse/A3E
    key: A3E
    id: '10013'
  # Directory where any local overrides are stored
  localOverridePath: .rovodev/atlassian_connections.json
  # Whether atlassian integration is enabled
  enabled: true

# Console and UI behavior settings
console:
  # Output format for console display (markdown, simple, or raw)
  outputFormat: markdown
  # Show tool execution results in the console
  showToolResults: true
  # Per-tool configuration for whether to show tool execution results in the
  # console
  toolResultVisibility:
    bash: true
    powershell: true
    open_files: true
    create_file: true
    delete_file: true
    move_file: true
    expand_code_chunks: true
    find_and_replace_code: true
    grep: true
    expand_folder: true
    update_allowed_external_paths: true
  # Editing mode for the prompt session
  editingMode: EMACS
  # Enable or disable cursor blinking in the input area. Defaults to true
  # (blinking).
  cursorBlink: true
  # Shell command to generate a command prompt that replaces the default '> '.
  # For example, set 'STARSHIP_SHELL=rovo dev starship prompt' to use Starship.
  customCommandPrompt: null
  # Color theme for syntax highlighting, background color, etc.
  theme: textual-dark (bg)
  # Maximum width of the console output in characters, or 'fill' to fill the
  # terminal width
  maxOutputWidth: 120
  # Enable or disable animated startup loading screen
  enableStartupAnimations: false
  # Automatically copy selected text to clipboard when text is selected in the
  # chat
  copyOnSelect: true
  # When enabled, Enter inserts a newline and double-Enter submits the message.
  # When disabled (default), Enter submits and Shift+Enter inserts a newline.
  multilineInput: false
  # Compact older agent turns to reduce memory usage in long sessions. Only the
  # last 5 turns stay fully expanded.
  compactMode: true
  # When enabled, prompts submitted while the agent is running are injected into
  # the next LLM request.
  steerMode: false
  # Show the local time on your prompts in the chat, and a day divider when the
  # date changes. 'prompts' (default) shows them, 'off' hides them.
  messageTimestamps: prompts
  # Clock format for prompt times: '24h' (default), '12h', or 'locale' to follow
  # your system locale.
  clockFormat: 24h
  # Terminal tab title settings
  terminalTitle:
    # Enable or disable automatic terminal tab title updates
    isEnabled: false
    # Terminal tab title format string. Supported template variables:   • {cwd}
    # — workspace directory name   • {project} — full workspace path   •
    # {branch}  — current git branch   • {session} — session title   • {model}
    # — current model name
    displayValue: Rovo Dev

# Logging and prompt collection settings
logging:
  # Path to the log file
  path: /home/emile/.rovodev/logs/rovodev.log
  # Minimum severity printed to stderr in non-interactive mode; 'NONE' disables
  # it. Does not affect the log file. Overridable via ROVO_DEV_STDERR_LOG_LEVEL.
  stderrLevel: ERROR

# Model Context Protocol server configuration
mcp:
  # Path to the MCP (Model Context Protocol) configuration file
  mcpConfigPath: /home/emile/.rovodev/mcp.json
  # List of allowed MCP server signatures
  allowedMcpServers: []
  # List of globally disabled MCP server signatures
  disabledMcpServers: []
  # List of MCP server signatures the user turned on. Needed only for
  # Integrations servers that ship turned off by default. disabledMcpServers
  # takes precedence
  enabledMcpServers: []

# Tool and command permission settings
toolPermissions:
  # Default permission for tools not explicitly listed
  default: ask
  # Permission settings for specific tools
  tools:
    create_file: allow
    delete_file: ask
    move_file: allow
    find_and_replace_code: allow
    open_files: allow
    expand_code_chunks: allow
    expand_folder: allow
    grep: allow
    atlassian_docs_search: allow
    get_session_metadata: allow
    rovo_search: allow
  bash:
    # Default permission for bash commands not explicitly listed
    default: ask
    # List of specific bash commands with their permission settings
    commands:
    - command: ^(ls|tree|pwd|file|stat|head|tail|cat|wc|du|df|readlink|realpath|basename|dirname)(\s.*)?$
      permission: allow
    - command: ^(rg|grep|strings|diff|cmp|sha256sum|md5sum)(\s.*)?$
      permission: allow
    - command: ^(sort|uniq|cut|tr|column)(\s.*)?$
      permission: allow
    - command: ^(echo|printf)(\s.*)?$
      permission: allow
    - command: ^(printenv|uname|whoami|id|which|whereis|type)(\s.*)?$
      permission: allow
    - command: ^env$
      permission: allow
    - command: ^date(\s+\+[^\s]+)?$
      permission: allow
    - command: ^(ps|pgrep|lsof)(\s.*)?$
      permission: allow
    - command: ^apt-cache(\s.*)?$
      permission: allow
    - command: ^git\s+(status|diff|log|show|blame|grep|ls-files|ls-tree|rev-parse|describe|shortlog)(\s.*)?$
      permission: allow
    - command: ^git\s+branch\s+(--list|-l)(\s.*)?$
      permission: allow
    - command: ^git\s+tag\s+--list(\s.*)?$
      permission: allow
    - command: ^git\s+remote\s+(-v|show)(\s.*)?$
      permission: allow
    - command: ^(done|then|else|fi|esac)$
      permission: allow
    - command: do(\s.*)?
      permission: allow
    - command: if(\s.*)?
      permission: allow
    - command: then(\s.*)?
      permission: allow
    - command: ^set\s+-[eux]+$
      permission: allow
    - command: git(\s.*)?
      permission: allow
    - command: test(\s.*)?
      permission: allow
    - command: command(\s.*)?
      permission: allow
    - command: find(\s.*)?
      permission: allow
    - command: xargs(\s.*)?
      permission: allow
    - command: ruby(\s.*)?
      permission: allow
    - command: for ds in album primary_downmix secondary_downmix
      permission: allow
    - command: do DATA_SET="$ds" LEVELS=-102.3,-102.4 auro_j=2 ruby core/build/ruby/build/runner.rb
        rake story/a3denc716.rb story:test > "tmp_rovodev_a3denc716_${ds}.log" 2>&1
      permission: allow
    - command: sed(\s.*)?
      permission: allow
    - command: nl(\s.*)?
      permission: allow
    - command: clang-format(\s.*)?
      permission: allow
    # Run bash commands in a sandboxed environment - currently available for
    # MacOS and Linux only. Enabling this option for Windows will prevent the
    # agent from running powershell commands.
    runInSandbox: false
    # Environment variables to set when running bash commands. Env vars are
    # automatically inherited from the user's environment, except for sensitive
    # variables such as API tokens and passwords. Use this config to set
    # additional env vars, or to pass secrets. Env vars can be set to strings or
    # can reference other env vars using the ${VAR_NAME} syntax.
    env: {}
  # List of file or directory paths that are allowed to be accessed outside the
  # workspace
  allowedExternalPaths:
  - /home/emile/repos/root-all
  - /home/emile/notes
  - /home/emile/.rovodev/config.yml

announcementTracking:
  announcementViewCounts: {}

sessionFeedback:
  permanentlyDisabled: false
  # ISO timestamp of the last provided feedback
  lastFeedbackAsked: null

atlassianBillingSite:
  siteUrl: https://auro-3d.atlassian.net

smartTasks:
  # Enable Smart Tasks discovery
  enabled: true
  # List of task discovery sources
  sources:
  - filesystem

# Event Hooks configuration. See /hooks command to list available events.
eventHooks:
  logFile: /home/emile/.rovodev/event_hooks.log
  events: []
